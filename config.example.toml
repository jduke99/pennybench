# Copy to pennybench.local.toml (ignored): private runner settings, not a local gateway.

[artifacts]
store = "runs"

[endpoints.proxy]
base_url = "https://api.pennyrouter.com"
env = { ENABLE_TOOL_SEARCH = "true" }
# For a private server, replace base_url with its Docker-reachable HTTPS endpoint.
# Signed-in claude-login trials identify your linked account; no Penny key is needed here.
# Token profiles may require a separate PennyRouter key:
# key_env = "PENNY_API_KEY"

[auth.claude-login]
kind = "claude_login"
min_valid_minutes = 30

# Optional token profiles. See docs/CREDENTIALS.md before using them with proxy arms.
[auth.claude-subscription]
kind = "oauth"
token_env = "CLAUDE_CODE_OAUTH_TOKEN"

[auth.anthropic-api]
kind = "api_key"
token_env = "ANTHROPIC_API_KEY"

# Optional dedicated task-image builder and soft cache cap.
# [docker]
# builder = "pennybench"
# build_cache_cap_gb = 40
