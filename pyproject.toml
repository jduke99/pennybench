[project]
name = "pennybench"
version = "0.1.0"
description = "Paired A/B benchmarking for coding-agent setups"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pennybench = "pennybench.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pennybench*"]
