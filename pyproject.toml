[project]
name = "pennybench"
version = "0.1.0"
description = "Paired A/B benchmarking for coding-agent setups"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jon Duke" }]
requires-python = ">=3.12"
dependencies = [
    "harbor==0.24.0",
    "mitmproxy==11.1.3",
    "numpy==2.3.3",
    "pyyaml>=6",
    "scipy==1.16.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pennybench = "pennybench.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pennybench*"]

[tool.setuptools.package-data]
pennybench = ["rates.json"]
